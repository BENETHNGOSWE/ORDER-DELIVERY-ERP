# ERPNext v16 + Delivery Logistics — production stack for Coolify.
# Follows the official frappe_docker v16 layout: ONE image (frappe/erpnext + our
# custom "delivery" app) is used for every role; a one-shot "configurator" writes
# the common site config (DB host, Redis, socketio) before the other services start.
#
# Only the `frontend` service is public. In Coolify point your domain at the
# `frontend` service on container port **8080**.
#
# Reference: https://github.com/frappe/frappe_docker/blob/main/compose.yaml

# The custom image = official frappe/erpnext:v16.34.1 + this repo's delivery app
# (installed at build time by the Dockerfile).
x-custom-image: &custom_image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      FRAPPE_TAG: v16.34.1
      APP_REPO: https://github.com/BENETHNGOSWE/ORDER-DELIVERY-ERP.git
      APP_BRANCH: main
      # Set GIT_TOKEN in Coolify "Build Variables" only if the repo is private.
      GIT_TOKEN: ${GIT_TOKEN:-}
  image: delivery-erpnext:v16.34.1
  pull_policy: build
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *custom_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  # One-shot init: lists installed apps into apps.txt and writes the shared
  # site config (db_host, redis_*, socketio_port). Exits 0 when done.
  configurator:
    <<: *backend_defaults
    restart: on-failure
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    <<: *backend_defaults
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  # Public nginx. Coolify domain -> THIS service, container port 8080.
  frontend:
    <<: *custom_image
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: 172.17.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "600"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    expose:
      - "8080"

  websocket:
    <<: [*depends_on_configurator, *custom_image]
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    command: bench schedule

  db:
    image: mariadb:11.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Coolify env vars}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  db-data:
  redis-queue-data:
