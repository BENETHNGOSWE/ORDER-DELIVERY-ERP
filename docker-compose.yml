# ============================================================================
# ERPNext / Frappe v16 on Coolify — production stack (permanent-app edition).
#
# Same proven layout as before, but every Frappe service now BUILDS the repo's
# Dockerfile (official frappe/erpnext v16.34.1 + the custom "delivery" app
# baked in). A Coolify deploy therefore always ships with the app installed:
# git push -> Deploy -> done. No manual get-app / install-app after updates.
#
# Data lives in named volumes (mariadb-data, sites, redis-queue-data) and is
# NOT affected by redeploys or container recreation. Only `frontend` is
# public (port 8080).
# ============================================================================
x-frappe-image: &frappe-image koda-delivery-erpnext:16.34.1
x-frappe-build: &frappe-build
  context: .
  dockerfile: Dockerfile
x-frappe-entrypoint: &frappe-entrypoint ["/bin/bash", "/opt/scripts/dl-entrypoint.sh"]

services:
  frontend:
    build:
      <<: *frappe-build
    image: *frappe-image
    entrypoint: *frappe-entrypoint
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: delivery.kodatechnologies.co.tz
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    expose:
      - "8080"

  backend:
    build:
      <<: *frappe-build
    image: *frappe-image
    entrypoint: *frappe-entrypoint
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

  websocket:
    build:
      <<: *frappe-build
    image: *frappe-image
    entrypoint: *frappe-entrypoint
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend

  scheduler:
    build:
      <<: *frappe-build
    image: *frappe-image
    entrypoint: *frappe-entrypoint
    restart: unless-stopped
    command:
      - bench
      - schedule
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend

  worker:
    build:
      <<: *frappe-build
    image: *frappe-image
    entrypoint: *frappe-entrypoint
    restart: unless-stopped
    command:
      - bench
      - worker
      - "--queue"
      - default,short,long
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: KodaDelivery2026Secure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --skip-host-cache
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 6s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  mariadb-data:
  redis-queue-data:
