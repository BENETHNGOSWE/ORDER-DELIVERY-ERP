# ============================================================================
# ERPNext / Frappe v16 on Coolify — production stack.
# Follows the proven Coolify layout: official frappe/erpnext v16 image for every
# role, with DB/Redis set as LITERAL environment variables on each service
# (no configurator, no host-header variable, no image build).
# Only `frontend` is public (port 8080). The custom "delivery" app is installed
# later from the backend terminal (see DEPLOY-COOLIFY.md).
# ============================================================================
services:
  frontend:
    image: frappe/erpnext:v16.34.1
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: delivery.kodatechnologies.co.tz
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    expose:
      - "8080"

  backend:
    image: frappe/erpnext:v16.34.1
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

  websocket:
    image: frappe/erpnext:v16.34.1
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend

  scheduler:
    image: frappe/erpnext:v16.34.1
    restart: unless-stopped
    command:
      - bench
      - schedule
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend

  worker:
    image: frappe/erpnext:v16.34.1
    restart: unless-stopped
    command:
      - bench
      - worker
      - "--queue"
      - default,short,long
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PASSWORD: KodaDelivery2026Secure
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: KodaDelivery2026Secure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --skip-host-cache
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 6s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  mariadb-data:
  redis-queue-data:
