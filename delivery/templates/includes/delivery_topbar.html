<div class="pc-topbar">
  <button id="pc-burger" class="pc-burger" type="button" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
  <a class="pc-mbrand" href="/delivery"><span class="lg"><img src="/assets/delivery/img/logo-mark.png" alt=""/></span> <span class="bt"><b>{{ platform_name or "Zanzi Express" }}</b><small>Fast &amp; Reliable Island Delivery</small></span></a>
  <div id="pc-backdrop" class="pc-backdrop"></div>
  <script>
  (function () {
    var b = document.getElementById("pc-burger"), d = document.getElementById("pc-backdrop");
    if (b) b.addEventListener("click", function () { document.body.classList.toggle("pc-side-open"); });
    if (d) d.addEventListener("click", function () { document.body.classList.remove("pc-side-open"); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") document.body.classList.remove("pc-side-open");
    });
  })();
  </script>
  <span class="pc-top-spacer"></span>
</div>
