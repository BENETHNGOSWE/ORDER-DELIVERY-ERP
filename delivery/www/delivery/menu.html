{% set page_title = "Menu" %}
<!doctype html><html lang="en"><head>
{% include "delivery/templates/includes/delivery_head.html" %}
</head><body>
<div class="dl-wrap">
  {% include "delivery/templates/includes/delivery_nav.html" %}

  <div class="dl-card">
    <div class="dl-row">
      <div style="flex:1">
        <label class="dl-label">Merchant</label>
        <select id="merchant" class="dl-select"></select>
      </div>
      <div style="flex:1">
        <label class="dl-label">Search</label>
        <input id="q" class="dl-input" placeholder="Search items">
      </div>
    </div>
  </div>

  <h2 id="title" class="dl-section-title">Catalogue</h2>
  <div id="items" class="dl-grid"><div class="dl-empty">Choose a merchant.</div></div>
</div>

<script src="/assets/delivery/js/delivery_portal.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var chosen = params.get("merchant");
  DELIVERY.loadCart();

  function load(merchant) {
    if (!merchant) return;
    DELIVERY.call("delivery.api.customer.merchant_catalog",
                  { merchant: merchant, search: document.getElementById("q").value })
      .then(function (data) {
        var host = document.getElementById("items");
        document.getElementById("title").textContent = data.merchant;
        if (!data.items.length) { host.innerHTML = '<div class="dl-empty">Nothing published yet.</div>'; return; }
        host.innerHTML = data.items.map(function (i) {
          var rate = i.discount_rate ? i.standard_rate * (1 - i.discount_rate / 100) : i.standard_rate;
          var out = i.track_stock && i.available_stock <= 0;
          return '<div class="dl-card">' +
            '<h3>' + DELIVERY.esc(i.item_name) + '</h3>' +
            '<div class="dl-mut">' + DELIVERY.esc(i.category || "") + '</div>' +
            '<div class="dl-mut">' + DELIVERY.esc(i.description || "") + '</div>' +
            '<div class="dl-between" style="margin-top:10px">' +
              '<span class="dl-price">' + DELIVERY.fmt(rate) + '</span>' +
              '<button class="dl-btn" data-item="' + DELIVERY.esc(i.name) +
                '" data-name="' + DELIVERY.esc(i.item_name) + '" data-rate="' + rate + '"' +
                (out ? " disabled" : "") + '>' + (out ? "Sold out" : "Add") + '</button>' +
            '</div>' +
            (i.track_stock ? '<div class="dl-mut">' + i.available_stock + ' in stock</div>' : '') +
            '</div>';
        }).join("");
        host.querySelectorAll("button[data-item]").forEach(function (b) {
          b.addEventListener("click", function () {
            DELIVERY.addToCart(merchant, b.dataset.item, b.dataset.name, b.dataset.rate, 1);
          });
        });
      })
      .catch(function (e) { DELIVERY.toast(e.message, "error"); });
  }

  DELIVERY.call("delivery.api.customer.platform_config").then(function (c) {
    DELIVERY.currency = c.currency;
  }).catch(function () {});

  DELIVERY.call("delivery.api.customer.list_merchants").then(function (rows) {
    var sel = document.getElementById("merchant");
    sel.innerHTML = rows.map(function (m) {
      return '<option value="' + m.name + '">' + DELIVERY.esc(m.merchant_name) + '</option>';
    }).join("");
    var pick = chosen && rows.some(function (m) { return m.name === chosen; })
               ? chosen : (rows[0] && rows[0].name);
    if (pick) { sel.value = pick; load(pick); }
    sel.addEventListener("change", function () { load(sel.value); });
  }).catch(function (e) { DELIVERY.toast(e.message, "error"); });

  var t;
  document.getElementById("q").addEventListener("input", function () {
    clearTimeout(t);
    t = setTimeout(function () { load(document.getElementById("merchant").value); }, 350);
  });
})();
</script>
</body></html>
